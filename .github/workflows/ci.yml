name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do
            node --check "$file"
          done

      - name: Test water generation and swimming
        run: node --test scripts/test-water.mjs scripts/test-swimming.mjs

      - name: Test actor corners, wall sliding and NPC collision
        run: node --test scripts/test-collision.mjs

      - name: Test voxel water flow and containment
        run: node --test scripts/test-fluids.mjs

      - name: Test audio scheduling and voice cleanup
        run: node --test scripts/test-audio.mjs

      - name: Test developer console shortcuts and commands
        run: node --test scripts/test-console.mjs

      - name: Test Hearth Tree collision and protection
        run: node --test scripts/test-hearth-tree.mjs

      - name: Test zombie defense gameplay
        run: node --test scripts/test-enemies.mjs scripts/test-special-enemies.mjs scripts/test-hell-gates.mjs scripts/check-enemy-balance-tests.mjs scripts/check-enemy-progression-tests.mjs

      - name: Test training, purchases and collectible coins
        run: node --test scripts/test-upgrades.mjs

      - name: Test strategic towers, purchases, relocation and combat
        run: node --test scripts/test-towers.mjs scripts/test-strategy.mjs scripts/check-tower-effects-tests.mjs

      - name: Test cave geology, traversal and camera targeting
        run: node --test scripts/test-caves.mjs scripts/test-targeting.mjs

      - name: Test player-centered minimap coordinates
        run: node --test scripts/test-minimap.mjs

      - name: Test herd combat, walls and paid builder towers
        run: node --test scripts/test-animals.mjs scripts/test-builder-towers.mjs

      - name: Test standalone model modules
        run: node --test scripts/test-model-modules.mjs

      - name: Test isolated NPC stuck recovery
        run: node --test scripts/test-animal-recovery.mjs

      - name: Build static site
        run: node scripts/build-site.mjs

      - name: Check static assets
        run: node scripts/check-site.mjs _site

      - name: Smoke-test the built page
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/goat-craft-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT

          for i in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.5
          done

          curl --fail --silent --show-error http://127.0.0.1:4173/ | grep -q "Meadow Goat"
          curl --fail --silent --show-error http://127.0.0.1:4173/css/style.css >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/js/items.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/js/fish.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/vendor/three.min.js >/dev/null
          echo "Static site served successfully."
